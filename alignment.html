<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>アライメント測定（スポイト学習＆プロ仕様版）</title>
  
  <style>
    body {
      margin: 0; padding: 0; background-color: #111; color: white;
      font-family: sans-serif;
    }
    
    /* 上部UI（モード切替と案内） */
    #ui-header {
      position: fixed; top: 0; width: 100%;
      background-color: rgba(51, 51, 51, 0.8);
      padding: 10px; text-align: center; z-index: 20;
    }
    .mode-btn {
      padding: 8px 15px; margin: 0 5px 10px 5px; font-weight: bold; border: none; border-radius: 5px;
      background-color: #555; color: white; cursor: pointer;
    }
    .mode-btn.active { background-color: #0078D4; } /* Microsoftブルー */
    #instruction { font-size: 16px; font-weight: bold; color: #FFD700; }

    video { display: none; } 
    canvas {
      width: 100vw; height: 100vh; object-fit: contain;
      background-color: #000; touch-action: pan-x pan-y;
    }

    /* 下部UI（操作ボタン群） */
    #ui-footer {
      position: fixed; bottom: 0; width: 100%;
      background-color: rgba(51, 51, 51, 0.8);
      padding: 15px 5px; display: flex; justify-content: space-evenly; z-index: 20;
    }
    .action-btn {
      padding: 10px 15px; font-size: 14px; font-weight: bold; border: none; border-radius: 20px;
      color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #btn-undo { background-color: #FF9500; } /* オレンジ色 */
    #btn-reset { background-color: #666; }
    #btn-save { background-color: #107C41; } /* 緑色 */

    /* 保存ポップアップ */
    #save-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center;
    }
    #save-modal p { color: white; font-weight: bold; margin-bottom: 15px; text-align: center; }
    #saved-image { max-width: 90%; max-height: 70%; border: 3px solid white; border-radius: 10px; }
    #btn-close-modal {
      margin-top: 20px; padding: 10px 30px; font-size: 16px; font-weight: bold;
      border-radius: 20px; background: #FF3B30; color: white; border: none; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui-header">
    <div>
      <button id="btn-sagittal" class="mode-btn active">矢状面</button>
      <button id="btn-frontal" class="mode-btn">前額面</button>
    </div>
    <div id="instruction">カメラ起動中...</div>
  </div>

  <video id="input_video" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>

  <div id="ui-footer">
    <button id="btn-undo" class="action-btn">↩ 1つ戻る</button>
    <button id="btn-reset" class="action-btn">🔄 全てリセット</button>
    <button id="btn-save" class="action-btn">📸 画像を保存</button>
  </div>

  <div id="save-modal">
    <p>👇 画像を「長押し」して保存してください</p>
    <img id="saved-image" src="" alt="アライメント画像" />
    <button id="btn-close-modal">✖ 閉じる</button>
  </div>

  <script>
    const video = document.getElementById('input_video');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const instructionEl = document.getElementById('instruction');

    // --- 1. 臨床データ設定 ---
    const markerLabels = {
      sagittal: ["①乳様突起", "②肩峰", "③大転子", "④膝蓋骨後面", "⑤外果の前方"],
      frontal: ["①喉頭隆起", "②椎骨棘突起", "③殿裂", "④両膝関節内側の中心", "⑤両内果間の中心"]
    };

    let currentMode = "sagittal"; // 初期モード
    let lockedMarkers = []; 
    let candidateBlobs = []; 
    let targetColor = null; // 【新機能】学習したシールの色（RGB）を入れる箱

    // モード切替ボタンの処理
    document.getElementById('btn-sagittal').addEventListener('click', (e) => {
      currentMode = "sagittal"; resetAll();
      e.target.classList.add('active'); document.getElementById('btn-frontal').classList.remove('active');
    });
    document.getElementById('btn-frontal').addEventListener('click', (e) => {
      currentMode = "frontal"; resetAll();
      e.target.classList.add('active'); document.getElementById('btn-sagittal').classList.remove('active');
    });

    // 案内文を更新する処理
    function updateInstruction() {
      const labels = markerLabels[currentMode];
      if (lockedMarkers.length === 0) {
        instructionEl.innerText = `画面に映る「${labels[0]}」のシールを直接タップして色を記憶させてください`;
        instructionEl.style.color = "white";
      } else if (lockedMarkers.length < 5) {
        instructionEl.innerText = `黄色い候補をタップ：次は「${labels[lockedMarkers.length]}」です`;
        instructionEl.style.color = "#FFD700";
      } else {
        instructionEl.innerText = `全マーカー（5つ）の設置が完了しました！`;
        instructionEl.style.color = "#00FF00";
      }
    }

    // カメラ起動
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(stream => {
      video.srcObject = stream;
      video.play();
      video.onloadeddata = () => {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        updateInstruction();
        requestAnimationFrame(trackStickers); 
      };
    }).catch(err => { alert("カメラの起動に失敗しました。"); });

    // --- 2. 画面タップでのスポイト＆確定処理 ---
    canvas.addEventListener('click', (e) => {
      if (lockedMarkers.length >= 5) return; // 5つ打ち終わっていたら何もしない

      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
      const displayWidth = canvas.width * scale;
      const displayHeight = canvas.height * scale;
      const offsetX = (rect.width - displayWidth) / 2;
      const offsetY = (rect.height - displayHeight) / 2;

      const clickX = Math.round((e.clientX - rect.left - offsetX) / scale);
      const clickY = Math.round((e.clientY - rect.top - offsetY) / scale);

      // 【スポイト機能】まだ1つもマーカーが無い場合、タップした場所の色を記憶する
      if (lockedMarkers.length === 0) {
        const pixel = ctx.getImageData(clickX, clickY, 1, 1).data;
        targetColor = { r: pixel[0], g: pixel[1], b: pixel[2] }; // RGBを記憶！
        lockedMarkers.push({ x: clickX, y: clickY });
        updateInstruction();
        return;
      }

      // 2つ目以降は、候補の中から近いものを探してロックする
      let closestBlob = null;
      let minDist = 10000; 
      candidateBlobs.forEach(blob => {
        const dist = (blob.x - clickX) ** 2 + (blob.y - clickY) ** 2;
        if (dist < minDist) { minDist = dist; closestBlob = blob; }
      });

      if (closestBlob) {
        lockedMarkers.push({ x: closestBlob.x, y: closestBlob.y });
        lockedMarkers.sort((a, b) => a.y - b.y); // Y座標（上）から順に並び替え
        updateInstruction();
      }
    });

    // --- 3. トラッキングと描画のメイン処理 ---
    function trackStickers() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 学習した色がある場合のみ、候補を探す（処理を軽くする工夫）
      if (targetColor && lockedMarkers.length < 5) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        let blobs = [];

        const step = 2; 
        for (let y = 0; y < canvas.height; y += step) {
          for (let x = 0; x < canvas.width; x += step) {
            const i = (y * canvas.width + x) * 4;
            const r = data[i], g = data[i + 1], b = data[i + 2]; 

            // 学習した色（targetColor）と「似ているか」を計算（許容誤差50）
            if (Math.abs(r - targetColor.r) < 50 && 
                Math.abs(g - targetColor.g) < 50 && 
                Math.abs(b - targetColor.b) < 50) {
              
              let foundBlob = false;
              for (let blob of blobs) {
                if (Math.abs(blob.x - x) < 30 && Math.abs(blob.y - y) < 30) {
                  blob.x = (blob.x * blob.count + x) / (blob.count + 1);
                  blob.y = (blob.y * blob.count + y) / (blob.count + 1);
                  blob.count++;
                  foundBlob = true; break;
                }
              }
              if (!foundBlob) blobs.push({ x: x, y: y, count: 1 });
            }
          }
        }
        candidateBlobs = blobs.filter(b => b.count > 3);
      } else {
        candidateBlobs = []; // 色を学習していない、または5個終わった時は候補を探さない
      }

      // トラッキング（ロックしたマーカーを動かす）
      lockedMarkers.forEach(marker => {
        let closest = null;
        let minDist = 90000; 
        candidateBlobs.forEach(blob => {
          const dist = (marker.x - blob.x) ** 2 + (marker.y - blob.y) ** 2;
          if (dist < minDist) { minDist = dist; closest = blob; }
        });
        if (closest) { marker.x = closest.x; marker.y = closest.y; }
      });

      // --- 描画処理 ---
      
      // 候補の表示（半透明の黄色）
      candidateBlobs.forEach(blob => {
        ctx.beginPath(); ctx.arc(blob.x, blob.y, 10, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 100, 0.8)'; ctx.lineWidth = 2; ctx.stroke();
      });

      if (lockedMarkers.length > 0) {
        // マーカー同士を結ぶ線（緑色）
        ctx.beginPath();
        ctx.moveTo(lockedMarkers[0].x, lockedMarkers[0].y);
        for (let i = 1; i < lockedMarkers.length; i++) {
          ctx.lineTo(lockedMarkers[i].x, lockedMarkers[i].y);
        }
        ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 4; ctx.stroke();

        // 【修正】1番上のマーカーから床への垂直線（赤色・点線）
        ctx.beginPath();
        ctx.moveTo(lockedMarkers[0].x, lockedMarkers[0].y);
        ctx.lineTo(lockedMarkers[0].x, canvas.height);
        ctx.strokeStyle = '#FF0000'; // 赤色
        ctx.setLineDash([10, 10]); ctx.lineWidth = 3; ctx.stroke();
        ctx.setLineDash([]);

        // マーカーと名称の描画
        const currentLabels = markerLabels[currentMode];
        lockedMarkers.forEach((marker, index) => {
          ctx.beginPath();
          ctx.arc(marker.x, marker.y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#FFD700'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = 'black'; ctx.stroke();

          // テキスト（名称）の描画
          ctx.fillStyle = 'white';
          ctx.font = 'bold 18px sans-serif';
          ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
          ctx.fillText(currentLabels[index], marker.x + 15, marker.y + 6);
          ctx.shadowBlur = 0;
        });
      }

      requestAnimationFrame(trackStickers);
    }

    // --- 4. ボタン操作処理 ---
    
    // 【新機能】1つ戻る（Undo）処理
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (lockedMarkers.length > 0) {
        lockedMarkers.pop(); // 配列の最後の要素を1つ削除
        if (lockedMarkers.length === 0) {
          targetColor = null; // 全部消えたら、学習した色もリセット
        }
        updateInstruction();
      }
    });

    // 全てリセット処理
    function resetAll() {
      lockedMarkers = [];
      targetColor = null;
      updateInstruction();
    }
    document.getElementById('btn-reset').addEventListener('click', resetAll);

    // 画像保存処理
    document.getElementById('btn-save').addEventListener('click', () => {
      const dataURL = canvas.toDataURL('image/png');
      document.getElementById('saved-image').src = dataURL;
      document.getElementById('save-modal').style.display = 'flex';
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('save-modal').style.display = 'none';
    });
  </script>
</body>
</html>
