<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- ピンチイン（拡大）ができるように viewport の設定を変更しました -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赤色シール自動追跡アプリ</title>
  
  <style>
    body {
      margin: 0; padding: 0; background-color: #111; color: white;
      font-family: sans-serif;
    }
    
    /* 上部のUIエリア */
    #ui-header {
      position: fixed; top: 0; width: 100%;
      background-color: rgba(51, 51, 51, 0.8);
      padding: 15px; text-align: center; z-index: 20;
    }
    
    #instruction { font-size: 16px; font-weight: bold; color: #FFD700; }

    /* 映像エリア */
    video { display: none; } /* 裏側でカメラを動かすための隠し要素 */
    canvas {
      width: 100vw; height: 100vh; object-fit: contain;
      background-color: #000;
    }

    /* 下部のボタンエリア */
    #ui-footer {
      position: fixed; bottom: 0; width: 100%;
      background-color: rgba(51, 51, 51, 0.8);
      padding: 15px; display: flex; justify-content: center; z-index: 20;
    }
    #btn-save {
      padding: 12px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 25px;
      background-color: #0078D4; color: white; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #btn-save:active { background-color: #005A9E; }
  </style>
</head>
<body>

  <div id="ui-header">
    <div id="instruction">赤いシールをカメラに映してください</div>
  </div>

  <!-- 裏で動くカメラと、表に表示するお絵描きキャンバス -->
  <video id="input_video" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>

  <div id="ui-footer">
    <button id="btn-save">📸 画像を保存</button>
  </div>

  <script>
    const video = document.getElementById('input_video');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const instructionEl = document.getElementById('instruction');

    // 1. カメラの起動設定
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(stream => {
      video.srcObject = stream;
      video.play();
      // カメラ映像が読み込まれたら、トラッキング開始
      video.onloadeddata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        requestAnimationFrame(trackRedStickers); // パラパラ漫画のように連続処理を開始
      };
    }).catch(err => {
      alert("カメラの起動に失敗しました。");
    });

    // 2. 赤色を見つけて線を引くメインプログラム（1秒間に約60回実行されます）
    function trackRedStickers() {
      // キャンバスに現在のカメラ映像をそのまま描く
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 映像のピクセル（色の粒）データをすべて取得する
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      let blobs = []; // 見つけた赤いシールの塊（座標）を入れる箱

      // 処理を軽くするため、4ピクセル飛ばしで画面全体の色をスキャン
      const step = 4;
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const i = (y * canvas.width + x) * 4;
          const r = data[i];     // 赤の強さ (0〜255)
          const g = data[i + 1]; // 緑の強さ
          const b = data[i + 2]; // 青の強さ

          // 【色判定】「赤が強く、緑と青が弱い」ピクセルを見つける
          // ※現場のシールの色や明るさに合わせて、ここの数字を調整できます
          if (r > 150 && g < 80 && b < 80) {
            
            // 近くにある赤いピクセル同士を「1つのシール」としてまとめる処理
            let foundBlob = false;
            for (let blob of blobs) {
              const dx = x - blob.x;
              const dy = y - blob.y;
              // 距離が近い（約60ピクセル以内）なら同じ塊にする
              if (dx * dx + dy * dy < 3600) {
                blob.x = (blob.x * blob.count + x) / (blob.count + 1);
                blob.y = (blob.y * blob.count + y) / (blob.count + 1);
                blob.count++;
                foundBlob = true;
                break;
              }
            }
            if (!foundBlob) {
              blobs.push({ x: x, y: y, count: 1 }); // 新しい塊として登録
            }
          }
        }
      }

      // ノイズ（たまたま赤かっただけの小さなゴミ）を除外（countが20以上の塊だけをシールとみなす）
      blobs = blobs.filter(b => b.count > 20);

      // 塊を「上から下」の順番に並び替える（Y座標が小さい順）
      blobs.sort((a, b) => a.y - b.y);

      // 画面上の案内文を更新
      if (blobs.length > 0) {
        instructionEl.innerText = `${blobs.length} 個のマーカーを追跡中！`;
      } else {
        instructionEl.innerText = `赤いシールを映してください`;
      }

      // 3. マーカーと線を自動で描画
      if (blobs.length > 0) {
        // --- A: シール同士を結ぶ線 ---
        ctx.beginPath();
        ctx.moveTo(blobs[0].x, blobs[0].y);
        for (let i = 1; i < blobs.length; i++) {
          ctx.lineTo(blobs[i].x, blobs[i].y);
        }
        ctx.strokeStyle = '#00FF00'; // 緑色の線
        ctx.lineWidth = 4;
        ctx.stroke();

        // --- B: 一番上のシールから下への垂直線 ---
        ctx.beginPath();
        ctx.moveTo(blobs[0].x, blobs[0].y);
        ctx.lineTo(blobs[0].x, canvas.height);
        ctx.strokeStyle = '#00BFFF'; // 水色の線
        ctx.setLineDash([15, 15]); // 点線
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.setLineDash([]);

        // --- C: 認識したシールの上にマーカーを描く ---
        blobs.forEach((blob, index) => {
          ctx.beginPath();
          ctx.arc(blob.x, blob.y, 12, 0, Math.PI * 2);
          ctx.fillStyle = '#FFD700'; // 黄色の丸
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'black'; // 黒フチ
          ctx.stroke();

          // マーカーの横に番号を表示（①, ②...の代わり）
          ctx.fillStyle = 'white';
          ctx.font = 'bold 24px sans-serif';
          ctx.shadowColor = 'black';
          ctx.shadowBlur = 4;
          ctx.fillText(index + 1, blob.x + 20, blob.y + 10);
          ctx.shadowBlur = 0;
        });
      }

      // 次のフレーム（瞬間）も同じ処理を繰り返す
      requestAnimationFrame(trackRedStickers);
    }

    // 画像保存ボタン
    document.getElementById('btn-save').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `アライメント測定_${new Date().getTime()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
