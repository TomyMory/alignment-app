<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>アライメント測定（自動アセスメント＆プロ仕様版）</title>
  
  <style>
    /* 全体のデザイン設定 */
    body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; }
    
    #ui-header {
      position: fixed; top: 0; width: 100%; background-color: rgba(51, 51, 51, 0.8);
      padding: 10px; text-align: center; z-index: 20;
    }
    .mode-btn {
      padding: 8px 15px; margin: 0 5px 10px 5px; font-weight: bold; border: none; border-radius: 5px;
      background-color: #555; color: white; cursor: pointer;
    }
    .mode-btn.active { background-color: #0078D4; } 
    #instruction { font-size: 16px; font-weight: bold; color: white; }

    video { display: none; } 
    canvas {
      width: 100vw; height: 100vh; object-fit: contain;
      background-color: #000; touch-action: pan-x pan-y;
    }

    #ui-footer {
      position: fixed; bottom: 0; width: 100%; background-color: rgba(51, 51, 51, 0.8);
      padding: 15px 5px; display: flex; justify-content: space-evenly; z-index: 20;
    }
    .action-btn {
      padding: 10px 15px; font-size: 14px; font-weight: bold; border: none; border-radius: 20px;
      color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #btn-undo { background-color: #FF9500; } 
    #btn-reset { background-color: #666; }
    #btn-save { background-color: #107C41; } 

    /* 各種ポップアップ（モーダル）のデザイン */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .modal-overlay p { color: white; font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 18px; }
    
    /* 向き選択ボタン */
    .direction-btn {
      padding: 15px 30px; margin: 10px; font-size: 18px; font-weight: bold;
      border-radius: 10px; border: none; cursor: pointer; background: #0078D4; color: white;
    }

    #saved-image { max-width: 90%; max-height: 70%; border: 3px solid white; border-radius: 10px; }
    #btn-close-save { margin-top: 20px; padding: 10px 30px; font-size: 16px; font-weight: bold; border-radius: 20px; background: #FF3B30; color: white; border: none; }

    /* アセスメント結果の表示ボックス */
    #assessment-box {
      display: none; position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.95); color: #333;
      padding: 15px 20px; border-radius: 10px; border-left: 8px solid #FF3B30;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold; font-size: 16px;
      z-index: 15; width: 85%; max-width: 400px; line-height: 1.5; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui-header">
    <div>
      <button id="btn-sagittal" class="mode-btn active">矢状面</button>
      <button id="btn-frontal" class="mode-btn">前額面</button>
    </div>
    <div id="instruction">カメラ起動中...</div>
  </div>

  <div id="assessment-box"></div>

  <video id="input_video" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>

  <div id="ui-footer">
    <button id="btn-undo" class="action-btn">↩ 1つ戻る</button>
    <button id="btn-reset" class="action-btn">🔄 全てリセット</button>
    <button id="btn-save" class="action-btn">📸 画像保存</button>
  </div>

  <!-- 【追加】向き選択のポップアップ -->
  <div id="direction-modal" class="modal-overlay">
    <p>被験者はどちらを向いていますか？</p>
    <div>
      <button id="btn-face-left" class="direction-btn">👈 左向き</button>
      <button id="btn-face-right" class="direction-btn">右向き 👉</button>
    </div>
  </div>

  <!-- 保存用ポップアップ -->
  <div id="save-modal" class="modal-overlay">
    <p>👇 画像を「長押し」して保存してください</p>
    <img id="saved-image" src="" alt="アライメント画像" />
    <button id="btn-close-save">✖ 閉じる</button>
  </div>

  <script>
    const video = document.getElementById('input_video');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const instructionEl = document.getElementById('instruction');
    const assessmentBox = document.getElementById('assessment-box');
    const directionModal = document.getElementById('direction-modal');

    // 臨床データ設定
    const markerLabels = {
      sagittal: ["①乳様突起", "②肩峰", "③大転子", "④膝蓋骨後面", "⑤外果の前方"],
      frontal: ["①喉頭隆起", "②椎骨棘突起", "③殿裂", "④両膝関節内側", "⑤両内果間"]
    };

    let currentMode = "sagittal"; 
    let sagittalFacing = null; // "left" または "right"
    let lockedMarkers = []; 
    let candidateBlobs = []; 
    let targetColor = null; 

    // --- モード切替と初期化 ---
    document.getElementById('btn-sagittal').addEventListener('click', (e) => {
      currentMode = "sagittal"; 
      e.target.classList.add('active'); document.getElementById('btn-frontal').classList.remove('active');
      resetAll(); // リセット時に向きもリセットされ、ポップアップが出ます
    });
    
    document.getElementById('btn-frontal').addEventListener('click', (e) => {
      currentMode = "frontal"; 
      e.target.classList.add('active'); document.getElementById('btn-sagittal').classList.remove('active');
      resetAll();
    });

    // 向き選択ボタンの処理
    document.getElementById('btn-face-left').addEventListener('click', () => {
      sagittalFacing = "left";
      directionModal.style.display = "none";
      updateInstruction();
    });
    document.getElementById('btn-face-right').addEventListener('click', () => {
      sagittalFacing = "right";
      directionModal.style.display = "none";
      updateInstruction();
    });

    // 指示文の更新
    function updateInstruction() {
      // 矢状面で向きが未決定の場合は、ここで処理を止める
      if (currentMode === "sagittal" && !sagittalFacing) {
        instructionEl.innerText = "向きを選択してください";
        return;
      }

      const labels = markerLabels[currentMode];
      if (lockedMarkers.length === 0) {
        instructionEl.innerText = `「${labels[0]}」部分に設置したマーカーを選択してください`;
        instructionEl.style.color = "white";
      } else if (lockedMarkers.length < 5) {
        instructionEl.innerText = `候補をタップ：次は「${labels[lockedMarkers.length]}」です`;
        instructionEl.style.color = "#FFD700";
      } else {
        instructionEl.innerText = `設置完了！（リアルタイム評価中）`;
        instructionEl.style.color = "#00FF00";
      }
    }

    // カメラ起動
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(stream => {
      video.srcObject = stream; video.play();
      video.onloadeddata = () => {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        resetAll(); // アプリ起動時に初期化処理を呼ぶ
        requestAnimationFrame(trackStickers); 
      };
    }).catch(err => { alert("カメラの起動に失敗しました。"); });

    // --- キャンバスのタップ処理 ---
    canvas.addEventListener('click', (e) => {
      // 矢状面で向きが未選択の時、または5個打ち終わった時はタップを無視
      if ((currentMode === "sagittal" && !sagittalFacing) || lockedMarkers.length >= 5) return; 

      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
      const offsetX = (rect.width - canvas.width * scale) / 2;
      const offsetY = (rect.height - canvas.height * scale) / 2;

      const clickX = Math.round((e.clientX - rect.left - offsetX) / scale);
      const clickY = Math.round((e.clientY - rect.top - offsetY) / scale);

      // スポイト機能
      if (lockedMarkers.length === 0) {
        const pixel = ctx.getImageData(clickX, clickY, 1, 1).data;
        targetColor = { r: pixel[0], g: pixel[1], b: pixel[2] }; 
        lockedMarkers.push({ x: clickX, y: clickY });
        updateInstruction();
        return;
      }

      let closestBlob = null;
      let minDist = 10000; 
      candidateBlobs.forEach(blob => {
        const dist = (blob.x - clickX) ** 2 + (blob.y - clickY) ** 2;
        if (dist < minDist) { minDist = dist; closestBlob = blob; }
      });

      if (closestBlob) {
        lockedMarkers.push({ x: closestBlob.x, y: closestBlob.y });
        lockedMarkers.sort((a, b) => a.y - b.y); 
        updateInstruction();
      }
    });

    // --- トラッキング処理 ---
    function trackStickers() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 色の探索
      if (targetColor) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        let blobs = [];

        for (let y = 0; y < canvas.height; y += 2) {
          for (let x = 0; x < canvas.width; x += 2) {
            const i = (y * canvas.width + x) * 4;
            if (Math.abs(data[i] - targetColor.r) < 50 && 
                Math.abs(data[i+1] - targetColor.g) < 50 && 
                Math.abs(data[i+2] - targetColor.b) < 50) {
              
              let found = false;
              for (let blob of blobs) {
                if (Math.abs(blob.x - x) < 30 && Math.abs(blob.y - y) < 30) {
                  blob.x = (blob.x * blob.count + x) / (blob.count + 1);
                  blob.y = (blob.y * blob.count + y) / (blob.count + 1);
                  blob.count++; found = true; break;
                }
              }
              if (!found) blobs.push({ x: x, y: y, count: 1 });
            }
          }
        }
        candidateBlobs = blobs.filter(b => b.count > 3);
      } else {
        candidateBlobs = []; 
      }

      // マーカーの追従
      lockedMarkers.forEach(marker => {
        let closest = null;
        let minDist = 90000; 
        candidateBlobs.forEach(blob => {
          const dist = (marker.x - blob.x) ** 2 + (marker.y - blob.y) ** 2;
          if (dist < minDist) { minDist = dist; closest = blob; }
        });
        if (closest) { marker.x = closest.x; marker.y = closest.y; }
      });

      // --- 描画処理 ---
      if (lockedMarkers.length < 5) {
        candidateBlobs.forEach(blob => {
          ctx.beginPath(); ctx.arc(blob.x, blob.y, 10, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 100, 0.8)'; ctx.lineWidth = 2; ctx.stroke();
        });
        assessmentBox.style.display = "none"; 
      }

      if (lockedMarkers.length > 0) {
        // マーカー間を繋ぐ線
        ctx.beginPath();
        ctx.moveTo(lockedMarkers[0].x, lockedMarkers[0].y);
        for (let i = 1; i < lockedMarkers.length; i++) {
          ctx.lineTo(lockedMarkers[i].x, lockedMarkers[i].y);
        }
        ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 4; ctx.stroke();

        // 垂直線（重心線）
        const baseMarker = lockedMarkers[lockedMarkers.length - 1]; 
        ctx.beginPath();
        ctx.moveTo(baseMarker.x, 0); ctx.lineTo(baseMarker.x, canvas.height);
        ctx.strokeStyle = '#FF0000'; ctx.setLineDash([10, 10]); ctx.lineWidth = 3; ctx.stroke();
        ctx.setLineDash([]);

        // マーカーの丸とテキスト
        const currentLabels = markerLabels[currentMode];
        lockedMarkers.forEach((marker, index) => {
          ctx.beginPath(); ctx.arc(marker.x, marker.y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#FFD700'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'black'; ctx.stroke();

          ctx.fillStyle = 'white'; ctx.font = 'bold 18px sans-serif';
          ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
          ctx.fillText(currentLabels[index], marker.x + 15, marker.y + 6);
          ctx.shadowBlur = 0;
        });

        // ==========================================
        // 【最優先】自動アセスメントロジック
        // ==========================================
        if (lockedMarkers.length === 5) {
          let issues = []; // ズレのリストを入れる箱
          const threshold = canvas.width * 0.03; // しきい値
          const baseX = baseMarker.x;

          if (currentMode === "sagittal") {
            // 前方へのズレ量（プラスなら前方、マイナスなら後方）を計算
            const getForwardOffset = (x) => {
              return sagittalFacing === "left" ? (baseX - x) : (x - baseX);
            };

            const mastoidOffset = getForwardOffset(lockedMarkers[0].x);   // ①乳様突起
            const acromionOffset = getForwardOffset(lockedMarkers[1].x);  // ②肩峰
            const trochanterOffset = getForwardOffset(lockedMarkers[2].x); // ③大転子
            const patellaOffset = getForwardOffset(lockedMarkers[3].x);    // ④膝蓋骨後面

            if (mastoidOffset > threshold) issues.push({ msg: "⚠️ 頭頚部が前方に偏位しています<br><span style='font-size:14px; color:#666;'>(ストレートネック等、首への負担大)</span>", diff: Math.abs(mastoidOffset) });
            if (acromionOffset > threshold) issues.push({ msg: "⚠️ 肩が前方に巻いています<br><span style='font-size:14px; color:#666;'>(猫背・巻き肩の疑い)</span>", diff: Math.abs(acromionOffset) });
            if (acromionOffset < -threshold) issues.push({ msg: "⚠️ 胸を張りすぎていませんか？<br><span style='font-size:14px; color:#666;'>(過伸展により腰部への負担大)</span>", diff: Math.abs(acromionOffset) });
            if (trochanterOffset > threshold) issues.push({ msg: "⚠️ 骨盤が前方にスライドしています<br><span style='font-size:14px; color:#666;'>(スウェイバック姿勢の疑い)</span>", diff: Math.abs(trochanterOffset) });
            if (patellaOffset < -threshold) issues.push({ msg: "⚠️ 膝が過伸展しています<br><span style='font-size:14px; color:#666;'>(反張膝・膝関節への負担大)</span>", diff: Math.abs(patellaOffset) });
          } 
          else if (currentMode === "frontal") {
            // 前額面のアセスメント
            const throatOffset = Math.abs(lockedMarkers[0].x - baseX); // ①喉頭隆起
            const spineOffset = Math.abs(lockedMarkers[1].x - baseX);  // ②椎骨棘突起
            const pelvisOffset = Math.abs(lockedMarkers[2].x - baseX); // ③殿裂

            if (throatOffset > threshold || spineOffset > threshold) {
              issues.push({ msg: "⚠️ 頭部・体幹が左右に傾いています<br><span style='font-size:14px; color:#666;'>(側弯や左右の筋力アンバランスの疑い)</span>", diff: Math.max(throatOffset, spineOffset) });
            }
            if (pelvisOffset > threshold) {
              issues.push({ msg: "⚠️ 骨盤が左右にシフトしています<br><span style='font-size:14px; color:#666;'>(片脚への荷重過多の疑い)</span>", diff: pelvisOffset });
            }
          }

          // ズレが大きい順に並び替え（ソート）
          issues.sort((a, b) => b.diff - a.diff);

          if (issues.length > 0) {
            // 最もズレが大きい第1位だけを表示する
            assessmentBox.innerHTML = issues[0].msg;
            assessmentBox.style.display = "block";
          } else {
            assessmentBox.style.display = "none";
          }
        }
      }

      requestAnimationFrame(trackStickers);
    }

    // --- 各種ボタン処理 ---
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (lockedMarkers.length > 0) {
        lockedMarkers.pop(); 
        if (lockedMarkers.length === 0) targetColor = null; 
        updateInstruction();
      }
    });

    function resetAll() {
      lockedMarkers = []; targetColor = null; sagittalFacing = null;
      assessmentBox.style.display = "none";
      
      // 矢状面なら向き選択ポップアップを表示
      if (currentMode === "sagittal") {
        directionModal.style.display = "flex";
      } else {
        directionModal.style.display = "none";
      }
      updateInstruction();
    }
    document.getElementById('btn-reset').addEventListener('click', resetAll);

    document.getElementById('btn-save').addEventListener('click', () => {
      const dataURL = canvas.toDataURL('image/png');
      document.getElementById('saved-image').src = dataURL;
      document.getElementById('save-modal').style.display = 'flex';
    });
    document.getElementById('btn-close-save').addEventListener('click', () => {
      document.getElementById('save-modal').style.display = 'none';
    });
  </script>
</body>
</html>
